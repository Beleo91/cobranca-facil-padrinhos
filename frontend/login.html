<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Cobrança Fácil">
  <meta name="application-name" content="Cobrança Fácil">
  <meta name="theme-color" content="#10b981">
  <meta name="description" content="Gerencie empréstimos e carnês. Acesse sua conta ou cadastre-se gratuitamente.">

  <title>Login &amp; Cadastro - Cobrança Fácil Padrinhos</title>

  <!-- PWA Manifest -->
  <link rel="manifest" href="/manifest.json">

  <!-- Favicons & Apple Touch Icons -->
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152x152.png">
  <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192x192.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: var(--bg-dark, #0b0f19);
      margin: 0;
      padding: 1.5rem;
      font-family: 'Inter', sans-serif;
    }
    .auth-card {
      width: 100%;
      max-width: 440px;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 2.5rem 2rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }
    .auth-brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }
    .auth-brand-icon {
      font-size: 2.2rem;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.4);
      padding: 0.4rem 0.6rem;
      border-radius: 12px;
    }
    .auth-brand-title {
      font-size: 1.6rem;
      font-weight: 700;
      color: #f8fafc;
      letter-spacing: -0.5px;
    }
    .auth-tabs {
      display: flex;
      background: rgba(30, 41, 59, 0.6);
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 2rem;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .auth-tab {
      flex: 1;
      text-align: center;
      padding: 0.6rem;
      font-size: 0.95rem;
      font-weight: 600;
      color: #94a3b8;
      border: none;
      background: transparent;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .auth-tab.active {
      background: var(--primary, #10b981);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
    }
    .auth-form {
      display: none;
    }
    .auth-form.active {
      display: block;
    }
    .form-group {
      margin-bottom: 1.25rem;
    }
    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      color: #cbd5e1;
      margin-bottom: 0.4rem;
    }
    .form-control {
      width: 100%;
      padding: 0.75rem 1rem;
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      color: #f8fafc;
      font-size: 0.95rem;
      box-sizing: border-box;
      transition: border 0.2s;
    }
    .form-control:focus {
      outline: none;
      border-color: var(--primary, #10b981);
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
    }
    .btn-submit {
      width: 100%;
      padding: 0.85rem;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      border: none;
      border-radius: 8px;
      color: #ffffff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 0.5rem;
      transition: transform 0.1s, box-shadow 0.2s;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.4);
    }
    .btn-submit:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.5);
    }
    .btn-submit:active {
      transform: translateY(0);
    }
    .auth-alert {
      display: none;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-bottom: 1.25rem;
      line-height: 1.4;
    }
    .auth-alert-danger {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
    }
    .auth-alert-success {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #6ee7b7;
    }
    .trial-badge-info {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.8rem;
      color: #64748b;
    }
  </style>
</head>
<body>

  <div class="auth-card">
    <div class="auth-brand">
      <div class="auth-brand-icon">💰</div>
      <div class="auth-brand-title">Cobrança Fácil Padrinhos</div>
    </div>

    <div class="auth-tabs">
      <button type="button" class="auth-tab active" onclick="switchAuthTab('login')">Entrar</button>
      <button type="button" class="auth-tab" onclick="switchAuthTab('register')">Criar Conta</button>
    </div>

    <div id="auth-alert" class="auth-alert"></div>

    <!-- FORM LOGIN -->
    <form id="form-login" class="auth-form active" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label>E-mail *</label>
        <input type="email" id="login-email" class="form-control" placeholder="seuemail@exemplo.com" required>
      </div>
      <div class="form-group">
        <label>Senha *</label>
        <input type="password" id="login-senha" class="form-control" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn-submit">Entrar no Sistema</button>
    </form>

    <!-- FORM REGISTRO -->
    <form id="form-register" class="auth-form" onsubmit="handleRegister(event)">
      <div class="form-group">
        <label>Nome Completo *</label>
        <input type="text" id="reg-nome" class="form-control" placeholder="Ex: Carlos Silva" required>
      </div>
      <div class="form-group">
        <label>E-mail *</label>
        <input type="email" id="reg-email" class="form-control" placeholder="seuemail@exemplo.com" required>
      </div>
      <div class="form-group">
        <label>Senha (mínimo 4 caracteres) *</label>
        <input type="password" id="reg-senha" class="form-control" placeholder="••••••••" minlength="4" required>
      </div>
      <button type="submit" class="btn-submit">Cadastrar Gratuitamente</button>
    </form>

    <div class="trial-badge-info">
      🎁 <strong>Teste Grátis:</strong> Cadastre até 2 clientes gratuitamente sem necessidade de cartão de crédito.
    </div>
  </div>

  <script>
    // Se já estiver autenticado, redireciona para o index
    if (localStorage.getItem('token')) {
      window.location.href = 'index.html';
    }

    function switchAuthTab(tab) {
      document.querySelectorAll('.auth-tab').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.auth-form').forEach(el => el.classList.remove('active'));
      hideAlert();

      if (tab === 'login') {
        document.querySelectorAll('.auth-tab')[0].classList.add('active');
        document.getElementById('form-login').classList.add('active');
      } else {
        document.querySelectorAll('.auth-tab')[1].classList.add('active');
        document.getElementById('form-register').classList.add('active');
      }
    }

    function showAlert(msg, type = 'danger') {
      const el = document.getElementById('auth-alert');
      el.className = `auth-alert auth-alert-${type}`;
      el.innerText = msg;
      el.style.display = 'block';
    }

    function hideAlert() {
      const el = document.getElementById('auth-alert');
      el.style.display = 'none';
    }

    async function handleLogin(e) {
      e.preventDefault();
      hideAlert();
      const email = document.getElementById('login-email').value.trim();
      const senha = document.getElementById('login-senha').value;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, senha })
        });

        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.detail || 'Falha ao efetuar login');
        }

        localStorage.setItem('token', data.access_token);
        localStorage.setItem('user', JSON.stringify(data.usuario));
        window.location.href = 'index.html';
      } catch (err) {
        showAlert(err.message, 'danger');
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      hideAlert();
      const nome = document.getElementById('reg-nome').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const senha = document.getElementById('reg-senha').value;

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nome, email, senha })
        });

        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.detail || 'Falha no cadastro');
        }

        localStorage.setItem('token', data.access_token);
        localStorage.setItem('user', JSON.stringify(data.usuario));
        window.location.href = 'index.html';
      } catch (err) {
        showAlert(err.message, 'danger');
      }
    }
  </script>
</body>
</html>
